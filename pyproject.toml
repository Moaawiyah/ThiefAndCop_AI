[project]
name = "hw6-cop-thief-mcp"
version = "1.00"
description = "Dual AI Agent Cop & Thief pursuit via MCP servers (HW6, Orchestration of AI Agents)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "openai>=1.0",
    "pygame>=2.6",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "prefect>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
