# ngrok configuration — Approach 2 (assignment §7.2), OPTIONAL legacy scaffold.
#
# NOTE: the default LLM backend is now the public GLM cloud API (Approach 1),
# which needs NO tunnel. This file only matters if you instead run a LOCAL
# Ollama-compatible server and want to expose it securely over HTTPS with a
# Traffic Policy that requires Basic Auth.
#
# Usage:
#   ngrok start --config deploy/ngrok.yaml ollama
# Then set in config.yaml:
#   llm.base_url: https://<your-subdomain>.ngrok-free.app/v1/
#   llm.api_key: "Basic <base64(user:pass)>"   # sent as the bearer key
#   llm.enabled: true

version: 3
agent:
  # authtoken: <paste your ngrok authtoken here, or set NGROK_AUTHTOKEN env var>

endpoints:
  - name: ollama
    url: # optional reserved domain, e.g. https://my-ollama.ngrok-free.app
    upstream:
      url: 11434           # local Ollama port (127.0.0.1:11434)
    traffic_policy:
      inline:
        on_http_request:
          # Reject any request without valid Basic Auth credentials.
          - actions:
              - type: basic-auth
                config:
                  realm: ollama
                  credentials:
                    - "uoh:change-me-strong-password"
