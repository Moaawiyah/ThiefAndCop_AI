# HW6 — Cop & Thief MCP pursuit. Central configuration (no hardcoding allowed, §10).

# --- Game parameters (Table 3) ---
grid_size: [5, 5]        # [rows, cols] of the 2D grid
max_moves: 25            # max moves per sub-game (משחקון)
num_games: 6             # sub-games per full game series (משחק)
max_barriers: 5          # max barriers the cop may place per sub-game

scoring:
  cop_win: 20            # cop captures the thief
  thief_win: 10          # thief survives max_moves
  cop_loss: 5            # cop's points when the thief escapes
  thief_loss: 5          # thief's points when caught

# --- Partial observability (§4.5 / §5.1) ---
vision_radius: 2         # Chebyshev radius each agent can "see" (partial: they
                         # start out of sight at distance 3 and must close in)

# --- Movement ---
allow_diagonal: true     # 8-directional movement incl. diagonals

# --- Start positions: "random" or explicit [row, col] ---
start:
  cop: random
  thief: random
  min_initial_distance: 4  # keep agents apart at start (> vision_radius for stage 3/4 sanity)

# --- LLM backend (Approach 1: public GLM cloud API, OpenAI-compatible) ---
# The API key is read from `api_key` below, or (preferred) from the GLM_API_KEY
# env var when api_key is empty. Keep secrets OUT of this committed file.
llm:
  model: glm-5
  base_url: https://api.z.ai/api/paas/v4   # z.ai GLM cloud (OpenAI-compatible)
  api_key: ""             # prefer exporting GLM_API_KEY in .env over hard-coding here
  enabled: true           # real GLM NL; falls back to templates when unreachable

# --- MCP servers (two separate servers, §5) ---
mcp:
  cop:
    host: 127.0.0.1
    port: 8101
  thief:
    host: 127.0.0.1
    port: 8102
  auth_token: "change-me-dev-token"  # token-based auth (§6)

# --- Q-Learning hyper-parameters (§8.2) ---
qlearning:
  learning_rate: 0.1
  discount_factor: 0.97      # balances long-term planning with stable learning

  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.9995          # cop explores, then gradually exploits
  thief_epsilon_decay: 0.9999    # thief explores longer to learn escape strategies

  episodes: 60000
  q_dir: artifacts               # where q_cop.npy / q_thief.npy / curves are written

  # --- Barrier behaviour ---
  # Barriers are a *situational* tool: they sit on the cop's own cell and cost it
  # a turn, so their reward is kept well below a capture (+cop_win). A visible-gated,
  # modest barrier lets the cop confine an already-cornered thief WITHOUT ever
  # out-valuing the direct "step onto the thief" capture move.
  confinement_weight: 0.30       # reward for reducing thief's reachable area (raised: more barriers)
  barrier_bonus: 0.60            # flat reward when a barrier actually confines (raised: more barriers)
  thief_freedom_weight: 0.80     # reward for keeping escape space open
  barrier_requires_visible: true # only barrier while the thief is visible (no blind
                                 # self-walling / wasted turns that stall the chase)

  # --- Movement behaviour ---
  idle_penalty: 0.15             # discourage standing still
  blind_stay_prob: 0.05          # only occasionally stay while searching
  revisit_penalty: 0.08          # discourage oscillating between cells
  loop_window: 3                 # remember more recent positions to detect loops

  # --- Training reward balancing ---
  thief_survive_reward: 35.0     # stronger terminal reward for successful survival/escape
  thief_dist_coef: 0.70          # encourage increasing distance from the cop
  cop_dist_coef: 0.10            # chase priority: close Chebyshev distance to the thief
  survive_bonus: 0.15            # reward surviving each additional turn
  search_move_bonus: 0.08        # reward active searching instead of waiting
  thief_blind_flee_coef: 0.15    # blind: flee directionally from cop's last-known cell
  thief_mobility_coef: 0.03      # reward open escape routes at new cell (anti-corner)
  thief_corner_penalty: 0.30     # flat penalty for stepping into a corner / trapped pocket

